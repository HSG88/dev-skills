name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 scripts/validate.py
      - run: python3 scripts/test_validate.py
      - run: python3 evaluations/coordination-result/test_exporter.py
      - run: python3 evaluations/check_coordination.py evaluations/coordination-result
